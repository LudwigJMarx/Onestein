[workspace]
members = ["crates/bdf"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/LudwigJMarx/Onestein"
rust-version = "1.85"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "warn"
unwrap_used = "warn"
indexing_slicing = "warn"
